    text-transform: uppercase;
    letter-spacing: 1px;

    padding: 2px 0;
    line-height: 1.25;
  }
  #calevents li.ev .t { color: #7ee787; font-weight: 700; }
  #calevents li.ev .past { color: #6e7681; }

  /* LEVY SLOUPEC - hodiny, pocasi, citat */
  #left {
    flex: 0 0 38%;
    min-width: 0;
    overflow: hidden;
    padding: 18px;
    display: flex;
    flex-direction: column;

    line-height: 1;
    color: #58a6ff;
  }

  }

    align-items: center;
    gap: 14px;
  }
  #wtemp {
    font-size: 58px;
    font-weight: 700;
    color: #f0f6fc;
  }
  #wicon { font-size: 52px; }
  #wcity {
    font-size: 15px;
    color: #58a6ff;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  #wdesc {
    font-size: 18px;
    color: #8b949e;
    margin-top: 4px;
  }
  #wforecast {

    display: flex;
    gap: 10px;
  }

    flex: 1;
    background: #161b22;
    border-radius: 8px;
    padding: 10px 6px;
    text-align: center;
  }

    color: #6e7681;

function wmo(c) {
  var m = {
    // ponytail: bez variantniho selektoru (U+FE0F) - stary Lightning ho nevykresli
    0:["☀","Jasno"], 1:["⛅","Skoro jasno"], 2:["⛅","Polojasno"],
    3:["☁","Zatazeno"], 45:["☁","Mlha"], 48:["☁","Mlha"],
    51:["🌧","Slabe mrholeni"], 53:["🌧","Mrholeni"], 55:["🌧","Silne mrholeni"],
    61:["🌧","Slaby dest"], 63:["🌧","Dest"], 65:["🌧","Silny dest"],
    71:["❄","Slabe snezeni"], 73:["❄","Snezeni"], 75:["❄","Silne snezeni"],
    80:["🌧","Prehanky"], 81:["🌧","Prehanky"], 82:["⛈","Silne prehanky"],
    95:["⛈","Bourka"], 96:["⛈","Bourka s krupobitim"], 99:["⛈","Silna bourka"]
  };
  return m[c] || ["☁","?"];
}

  var q = QUOTES[dayOfYear % QUOTES.length];
  document.querySelector("#quote .q").innerHTML = "&bdquo;" + q[0] + "&ldquo;";
  document.querySelector("#quote .a").innerHTML = "&mdash; " + q[1];
}

// ---------- KALENDAR (events.json z GitHub Action) ----------
function loadCal() {
  var x = new XMLHttpRequest();
  x.onreadystatechange = function() {
    if (x.readyState != 4) return;
    if (x.status != 200) {
      document.getElementById("calevents").innerHTML = '<li class="cday">kalendar nedostupny</li>';
      return;
    }
    try { renderCal(JSON.parse(x.responseText)); }
    catch(e) { document.getElementById("calevents").innerHTML = '<li class="cday">chyba kalendare</li>'; }
  };
  x.open("GET", "https://david-test-cmd.github.io/dashboard/events.json?t=" + new Date().getTime(), true);
  x.send();
}

function renderCal(evs) {
  var el = document.getElementById("calevents");
  if (!evs.length) { el.innerHTML = '<li class="cday">zadne udalosti</li>'; return; }
  var now = new Date();
  var todayISO = now.getFullYear() + "-" + pad(now.getMonth()+1) + "-" + pad(now.getDate());
  var html = "", lastDate = "";
  for (var i = 0; i < evs.length && i < 12; i++) {
    var e = evs[i];
    if (e.date != lastDate) {
      lastDate = e.date;
      var dt = new Date(e.date + "T12:00:00");
      var lbl = (e.date == todayISO) ? "Dnes" : DNAMES[dt.getDay()] + " " + dt.getDate() + ".";
      html += '<li class="cday">' + lbl + '</li>';
    }
    var t = e.time ? '<span class="t">' + e.time + '</span> ' : "";
    html += '<li class="ev">' + t + e.title + '</li>';
  }
  el.innerHTML = html;
}

loadCal();
setInterval(loadCal, 60 * 60 * 1000);

function setStatus(s) { document.getElementById("status").innerHTML = s + " | " + new Date().toLocaleTimeString(); }

// ---------- POCASI ----------
function loadWeather() {
  var url = "https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+
    "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m"+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min"+
    "&timezone=Europe/Prague&forecast_days=4";
  var x = new XMLHttpRequest();
  x.onreadystatechange = function() {
    if (x.readyState != 4) return;
    if (x.status != 200) { setStatus("pocasi: chyba "+x.status); return; }
    try { renderWeather(JSON.parse(x.responseText)); }
    catch(e) { setStatus("pocasi: parse err"); }
  };
  x.open("GET", url, true);
  x.send();
}

function renderWeather(d) {
  var c = d.current, w = wmo(c.weather_code);
  document.getElementById("wicon").innerHTML = w[0];
  document.getElementById("wtemp").innerHTML = Math.round(c.temperature_2m)+"&deg;";
  document.getElementById("wdesc").innerHTML = w[1]+" &middot; vlhkost "+c.relative_humidity_2m+
    "% &middot; vitr "+Math.round(c.wind_speed_10m)+" km/h";

  var html = "", dd = d.daily;
  for (var i = 1; i < dd.time.length && i <= 3; i++) {
    var dt = new Date(dd.time[i]+"T12:00:00");
    var wn = wmo(dd.weather_code[i]);
    html += '<div class="fday"><div class="n">'+DNAMES[dt.getDay()].substring(0,2)+'</div>'+
      '<div class="i">'+wn[0]+'</div><div class="t">'+Math.round(dd.temperature_2m_max[i])+
      '&deg; <span class="lo">'+Math.round(dd.temperature_2m_min[i])+'&deg;</span></div></div>';
  }
  document.getElementById("wforecast").innerHTML = html;
  setStatus("pocasi OK");
}

var FEEDS = [
  { name: "CT24",     url: "https://ct24.ceskatelevize.cz/rss/hlavni-zpravy" },
  { name: "iRozhlas", url: "https://www.irozhlas.cz/rss/irozhlas" }
];
var allNews = [];
var feedsDone = 0;

function loadNews() {
  allNews = []; feedsDone = 0;
  for (var i = 0; i < FEEDS.length; i++) fetchFeed(FEEDS[i]);
}

function fetchFeed(f) {
  var x = new XMLHttpRequest();
  x.onreadystatechange = function() {
    if (x.readyState != 4) return;
    if (x.status == 200) parseFeed(f.name, x.responseText);
    feedsDone++;
    if (feedsDone >= FEEDS.length) renderNews();
  };
  x.open("GET", f.url, true);
  x.send();
}

function clean(s) {
  return s.replace(/<!\[CDATA\[|\]\]>/g,"").replace(/<[^>]*>/g,"")
          .replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&#39;/g,"'")
          .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim();
}

function parseFeed(srcName, xml) {
  var items = xml.split("<item>");
  for (var i = 1; i < items.length && i <= 8; i++) {
    var it = items[i];
    var tm = it.match(/<title>([\s\S]*?)<\/title>/);
    var pm = it.match(/<pubDate>([\s\S]*?)<\/pubDate>/);
    if (!tm) continue;
    var title = clean(tm[1]);
    if (!title) continue;
    var when = "";
    if (pm) {
      var d = new Date(pm[1]);
      if (!isNaN(d.getTime())) {
        var mins = Math.round((new Date() - d) / 60000);
        if (mins < 60) when = mins+" min";
        else if (mins < 1440) when = Math.round(mins/60)+" h";
        else when = Math.round(mins/1440)+" d";
      }
    }
    allNews.push({ t: title, s: srcName, w: when, ts: pm ? new Date(pm[1]).getTime() : 0 });
  }
}

function renderNews() {
  allNews.sort(function(a,b){ return b.ts - a.ts; });
  var html = "";
  for (var i = 0; i < allNews.length && i < 14; i++) {
    var n = allNews[i];
    html += '<li><div class="hl">'+n.t+'</div><div class="meta"><span class="tag">'+n.s+
            '</span>'+(n.w ? ' &middot; '+n.w : '')+'</div></li>';
  }
  document.getElementById("news").innerHTML = html || '<li><span class="hl">Zadne zpravy</span></li>';
  setStatus("zpravy OK ("+allNews.length+")");
}

// ---------- START ----------
loadWeather();
loadNews();
setInterval(loadWeather, WEATHER_REFRESH_MIN * 60 * 1000);
setInterval(loadNews, NEWS_REFRESH_MIN * 60 * 1000);
</script>
