<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: "Roboto", Arial, sans-serif;
  }
  /* ponytail: 100% misto vh - Lightning/Firefox hlasily spatnou vysku */
  #page {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
  }
  #wrap { display: flex; flex: 1 1 auto; min-height: 0; }
  #cal {
    flex: 0 0 34%;
    min-height: 0;
    border-top: 2px solid #21262d;
    padding: 6px 10px 10px;
  }
  #quote {
    margin-top: 16px;
    padding: 12px 14px;
    background: #161b22;
    border-left: 3px solid #58a6ff;
    border-radius: 6px;
  }
  #quote .q { font-size: 16px; font-style: italic; line-height: 1.4; color: #c9d1d9; }
  #quote .a { font-size: 13px; color: #58a6ff; margin-top: 6px; text-align: right; }
  #cal iframe {
    width: 100%; height: 100%; border: 0; border-radius: 6px;
    /* ponytail: inverze barev, Google Calendar embed dark mode neumi */
    filter: invert(0.92) hue-rotate(180deg);
  }

  /* LEVY SLOUPEC - hodiny, pocasi, citat */
  #left {
    flex: 0 0 38%;
    min-width: 0;
    overflow: hidden;
    padding: 18px;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #21262d;
  }
  #clock {
    font-size: 68px;
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1;
    color: #58a6ff;
  }
  #date {
    font-size: 20px;
    color: #8b949e;
    margin-top: 6px;
    text-transform: capitalize;
  }
  #weather {
    margin-top: 22px;
    flex: 1;
  }
  #wnow {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #wtemp {
    font-size: 58px;
    font-weight: 700;
    color: #f0f6fc;
  }
  #wicon { font-size: 52px; }
  #wcity {
    font-size: 15px;
    color: #58a6ff;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  #wdesc {
    font-size: 18px;
    color: #8b949e;
    margin-top: 4px;
  }
  #wforecast {
    margin-top: 20px;
    display: flex;
    gap: 10px;
  }
  .fday {
    flex: 1;
    background: #161b22;
    border-radius: 8px;
    padding: 10px 6px;
    text-align: center;
  }
  .fday .n { font-size: 13px; color: #8b949e; }
  .fday .i { font-size: 26px; margin: 4px 0; }
  .fday .t { font-size: 15px; font-weight: 600; }
  .fday .t .lo { color: #6e7681; font-weight: 400; }

  /* PRAVY SLOUPEC - zpravy */
  #right {
    flex: 1 1 auto;
    min-width: 0;
    padding: 16px;
    overflow: hidden;
  }
  #rhead {
    font-size: 15px;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding-bottom: 8px;
    border-bottom: 1px solid #21262d;
    margin-bottom: 10px;
  }
  .src { color: #58a6ff; font-weight: 700; }
  #news { list-style: none; }
  #news li {
    padding: 9px 0;
    border-bottom: 1px solid #161b22;
  }
  #news .hl {
    font-size: 19px;
    line-height: 1.25;
    color: #f0f6fc;
  }
  #news .meta {
    font-size: 12px;
    color: #6e7681;
    margin-top: 3px;
  }
  #news .meta .tag { color: #7ee787; }
  #status {
    position: fixed;
    bottom: 4px; right: 8px;
    font-size: 11px;
    color: #484f58;
  }
</style>
</head>
<body>
<div id="page">
<div id="wrap">
  <div id="left">
    <div id="clock">--:--</div>
    <div id="date">nacteni...</div>
    <div id="weather">
      <div id="wcity">Velesovice</div>
      <div id="wnow">
        <div id="wicon">--</div>
        <div id="wtemp">--&deg;</div>
      </div>
      <div id="wdesc">pocasi se nacita</div>
      <div id="wforecast"></div>
    </div>
    <div id="quote"><div class="q"></div><div class="a"></div></div>
  </div>
  <div id="right">
    <div id="rhead">Zpravy &mdash; <span class="src">CT24 + iRozhlas</span></div>
    <ul id="news"><li><span class="hl">Nacitam zpravy...</span></li></ul>
  </div>
</div>
<div id="cal">
  <iframe src="https://calendar.google.com/calendar/embed?src=bulinci.foto%40gmail.com&ctz=Europe%2FPrague&mode=WEEK&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0" scrolling="no"></iframe>
</div>
</div>
<div id="status">--</div>

<script>
// ---------- NASTAVENI ----------
var LAT = 49.177, LON = 16.849;   // Velesovice (okres Vyskov)
var CITY = "Velesovice";
var NEWS_REFRESH_MIN = 15;       // obnoveni zprav (minuty)
var WEATHER_REFRESH_MIN = 15;    // obnoveni pocasi
// ------------------------------

var DNAMES = ["nedele","pondeli","utery","streda","ctvrtek","patek","sobota"];
var MNAMES = ["ledna","unora","brezna","dubna","kvetna","cervna","cervence","srpna","zari","rijna","listopadu","prosince"];

// WMO weather code -> ikona + popis
function wmo(c) {
  var m = {
    0:["☀️","Jasno"], 1:["🌤️","Skoro jasno"], 2:["⛅","Polojasno"],
    3:["☁️","Zatazeno"], 45:["🌫️","Mlha"], 48:["🌫️","Mlha"],
    51:["🌦️","Slabe mrholeni"], 53:["🌦️","Mrholeni"], 55:["🌦️","Silne mrholeni"],
    61:["🌧️","Slaby dest"], 63:["🌧️","Dest"], 65:["🌧️","Silny dest"],
    71:["🌨️","Slabe snezeni"], 73:["🌨️","Snezeni"], 75:["❄️","Silne snezeni"],
    80:["🌦️","Prehanky"], 81:["🌧️","Prehanky"], 82:["⛈️","Silne prehanky"],
    95:["⛈️","Bourka"], 96:["⛈️","Bourka s krupobitim"], 99:["⛈️","Silna bourka"]
  };
  return m[c] || ["☁️","?"];
}

function pad(n){ return (n<10?"0":"")+n; }

function tick() {
  var d = new Date();
  document.getElementById("clock").innerHTML = pad(d.getHours())+":"+pad(d.getMinutes());
  document.getElementById("date").innerHTML = DNAMES[d.getDay()]+" "+d.getDate()+". "+MNAMES[d.getMonth()]+" "+d.getFullYear();
}
tick();
setInterval(tick, 10000);

// ---------- CITAT DNE ----------
// ponytail: 30 citatu, index = den v roce % 30. Staci, meni se kazdy den.
var QUOTES = [
  ["Jedinej clovek, kterej nikdy neudela chybu, je ten, kterej nic nedela.", "Theodore Roosevelt"],
  ["Zivot je to, co se ti deje, zatimco si delas jiny plany.", "John Lennon"],
  ["Nezalezi na tom, jak pomalu jdes, dokud se nezastavis.", "Konfucius"],
  ["Nejlepsi cas zasadit strom byl pred dvaceti lety. Druhej nejlepsi je ted.", "Cinske prislovi"],
  ["Uspech je schopnost jit od neuspechu k neuspechu, aniz bys ztratil nadseni.", "Winston Churchill"],
  ["Bud zmenou, kterou chces videt ve svete.", "Mahatma Gandhi"],
  ["Vsechno, co jsi kdy chtel, je na druhe strane strachu.", "George Addair"],
  ["Stastny clovek nema vsechno nejlepsi, ale vytezi ze vseho, co ma.", "Neznamy"],
  ["Necekej na spravnou chvili. Vezmi chvili a udelej ji spravnou.", "Neznamy"],
  ["Cesta tisice mil zacina jednim krokem.", "Lao-c"],
  ["Kdo chce, hleda zpusob. Kdo nechce, hleda duvod.", "Neznamy"],
  ["Nejvetsi slava neni v tom nikdy nepadnout, ale v tom vzdy vstat.", "Konfucius"],
  ["Tajemstvi zmeny je soustredit vsechnu energii ne na boj se starym, ale na budovani noveho.", "Sokrates"],
  ["Clovek je tak stastny, jak umi byt.", "Abraham Lincoln"],
  ["Nadeje neni predpoved, je to schopnost pracovat pro neco lepsiho.", "Neznamy"],
  ["Nemusis byt skvelej, abys zacal. Ale musis zacit, abys byl skvelej.", "Zig Ziglar"],
  ["Kazdy den je nova sance zmenit svuj zivot.", "Neznamy"],
  ["Silnejsi nez vsechno na svete je ticho, ktere nasleduje po dobre odpovedi.", "Neznamy"],
  ["Cas, ktery si uzijes, neni cas ztraceny.", "John Lennon"],
  ["Nejlepsi odplata za krivdu je nebyt jako ten, kdo ji udelal.", "Marcus Aurelius"],
  ["Nezlob se, ze nemuzes zmenit minulost. Zmen pritomnost.", "Neznamy"],
  ["Mysli pozitivne, protoze tve myslenky se stvavaji tvym zivotem.", "Neznamy"],
  ["Jen ten, kdo riskuje, muze ziskat vse.", "Neznamy"],
  ["Vzdelani je nejmocnejsi zbran, kterou muzes zmenit svet.", "Nelson Mandela"],
  ["Zivot zacina na konci tve komfortni zony.", "Neznamy"],
  ["Nekdy je prohra to nejlepsi, co se ti muze stat.", "Neznamy"],
  ["Delej maly veci s velkou laskou.", "Matka Tereza"],
  ["Kdo se boji, nesmi do lesa.", "Ceske prislovi"],
  ["Trpelivost je strom, jehoz koren je horky, ale plod sladky.", "Nemecke prislovi"],
  ["Rano moudry, vecer blazen.", "Ceske prislovi"]
];

function showQuote() {
  var d = new Date();
  var dayOfYear = Math.floor((d - new Date(d.getFullYear(),0,0)) / 86400000);
  var q = QUOTES[dayOfYear % QUOTES.length];
  document.querySelector("#quote .q").innerHTML = "&bdquo;" + q[0] + "&ldquo;";
  document.querySelector("#quote .a").innerHTML = "&mdash; " + q[1];
}
showQuote();


// ponytail: Firefox 68 na KitKatu spatne hlasi vysku - merime okno rucne
function fit() {
  var h = window.innerHeight || document.documentElement.clientHeight || 768;
  document.getElementById("page").style.height = h + "px";
}
fit();
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", fit);
setTimeout(fit, 500);
setTimeout(fit, 1500);
setTimeout(fit, 3000);

function setStatus(s) { document.getElementById("status").innerHTML = s + " | " + new Date().toLocaleTimeString(); }

// ---------- POCASI ----------
function loadWeather() {
  var url = "https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+
    "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m"+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min"+
    "&timezone=Europe/Prague&forecast_days=4";
  var x = new XMLHttpRequest();
  x.onreadystatechange = function() {
    if (x.readyState != 4) return;
    if (x.status != 200) { setStatus("pocasi: chyba "+x.status); return; }
    try { renderWeather(JSON.parse(x.responseText)); }
    catch(e) { setStatus("pocasi: parse err"); }
  };
  x.open("GET", url, true);
  x.send();
}

function renderWeather(d) {
  var c = d.current, w = wmo(c.weather_code);
  document.getElementById("wicon").innerHTML = w[0];
  document.getElementById("wtemp").innerHTML = Math.round(c.temperature_2m)+"&deg;";
  document.getElementById("wdesc").innerHTML = w[1]+" &middot; vlhkost "+c.relative_humidity_2m+
    "% &middot; vitr "+Math.round(c.wind_speed_10m)+" km/h";

  var html = "", dd = d.daily;
  for (var i = 1; i < dd.time.length && i <= 3; i++) {
    var dt = new Date(dd.time[i]+"T12:00:00");
    var wn = wmo(dd.weather_code[i]);
    html += '<div class="fday"><div class="n">'+DNAMES[dt.getDay()].substring(0,2)+'</div>'+
      '<div class="i">'+wn[0]+'</div><div class="t">'+Math.round(dd.temperature_2m_max[i])+
      '&deg; <span class="lo">'+Math.round(dd.temperature_2m_min[i])+'&deg;</span></div></div>';
  }
  document.getElementById("wforecast").innerHTML = html;
  setStatus("pocasi OK");
}

// ---------- ZPRAVY ----------
// Jen zdroje s CORS (access-control-allow-origin: *)
var FEEDS = [
  { name: "CT24",     url: "https://ct24.ceskatelevize.cz/rss/hlavni-zpravy" },
  { name: "iRozhlas", url: "https://www.irozhlas.cz/rss/irozhlas" }
];
var allNews = [];
var feedsDone = 0;

function loadNews() {
  allNews = []; feedsDone = 0;
  for (var i = 0; i < FEEDS.length; i++) fetchFeed(FEEDS[i]);
}

function fetchFeed(f) {
  var x = new XMLHttpRequest();
  x.onreadystatechange = function() {
    if (x.readyState != 4) return;
    if (x.status == 200) parseFeed(f.name, x.responseText);
    feedsDone++;
    if (feedsDone >= FEEDS.length) renderNews();
  };
  x.open("GET", f.url, true);
  x.send();
}

function clean(s) {
  return s.replace(/<!\[CDATA\[|\]\]>/g,"").replace(/<[^>]*>/g,"")
          .replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&#39;/g,"'")
          .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim();
}

function parseFeed(srcName, xml) {
  var items = xml.split("<item>");
  for (var i = 1; i < items.length && i <= 8; i++) {
    var it = items[i];
    var tm = it.match(/<title>([\s\S]*?)<\/title>/);
    var pm = it.match(/<pubDate>([\s\S]*?)<\/pubDate>/);
    if (!tm) continue;
    var title = clean(tm[1]);
    if (!title) continue;
    var when = "";
    if (pm) {
      var d = new Date(pm[1]);
      if (!isNaN(d.getTime())) {
        var mins = Math.round((new Date() - d) / 60000);
        if (mins < 60) when = mins+" min";
        else if (mins < 1440) when = Math.round(mins/60)+" h";
        else when = Math.round(mins/1440)+" d";
      }
    }
    allNews.push({ t: title, s: srcName, w: when, ts: pm ? new Date(pm[1]).getTime() : 0 });
  }
}

function renderNews() {
  allNews.sort(function(a,b){ return b.ts - a.ts; });
  var html = "";
  for (var i = 0; i < allNews.length && i < 14; i++) {
    var n = allNews[i];
    html += '<li><div class="hl">'+n.t+'</div><div class="meta"><span class="tag">'+n.s+
            '</span>'+(n.w ? ' &middot; '+n.w : '')+'</div></li>';
  }
  document.getElementById("news").innerHTML = html || '<li><span class="hl">Zadne zpravy</span></li>';
  setStatus("zpravy OK ("+allNews.length+")");
}

// ---------- START ----------
loadWeather();
loadNews();
setInterval(loadWeather, WEATHER_REFRESH_MIN * 60 * 1000);
setInterval(loadNews, NEWS_REFRESH_MIN * 60 * 1000);
</script>
</body>
</html>
